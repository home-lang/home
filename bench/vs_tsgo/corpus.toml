# Reproducible, generated TypeScript frontend workloads. All compilers receive
# the same project and flags. `noLib` deliberately isolates frontend work from
# differences in bundled standard-library size and availability.

[generated]
many_files_count = 256
deep_types_repetitions = 240
import_graph_modules = 128
reexport_graph_leaves = 64
reexport_graph_barrel_size = 8
tsx_components = 256
generic_calls = 256
control_flow_functions = 256
overload_call_groups = 128
class_hierarchy_families = 128
structural_object_families = 128
interface_composition_families = 128

[workloads.startup]
description = "One small, valid file; isolates cold CLI and frontend startup."

[workloads.many_files]
description = "256 independent files using generics, unions, callbacks, and inference."

[workloads.deep_types]
description = "One large file stressing conditional, mapped, indexed, and template literal types."

[workloads.import_graph]
description = "128 modules in a relative-import chain with cross-file generic types and values."

[workloads.reexport_graph]
description = "64 leaf modules projected through eight export-star barrel modules."

[workloads.tsx_components]
description = "One TSX module with 256 typed generic component declarations and JSX trees."

[workloads.generic_calls]
description = "One module with 256 constrained generic projections, indexed accesses, and contextual callbacks."

[workloads.control_flow]
description = "One module with 256 exhaustive discriminated-union functions and definite-assignment joins."

[workloads.overload_resolution]
description = "One module with 128 call groups selecting among eight generic overloads with contextual arguments."

[workloads.class_hierarchy]
description = "One module with 128 generic class families covering inheritance, overrides, constructors, and structural use."

[workloads.structural_objects]
description = "One module with 128 plain-object families covering nested structural compatibility, tuples, intersections, and generic function properties."

[workloads.interface_composition]
description = "One module with 128 generic interface families covering multi-base inheritance, declaration merging, namespace merging, and structural consumption."

[compilers.tsc]
version = "6.0.3"

[compilers.tsgo]
version = "7.0.2"

[compilers.home]
binary = "zig-out/bin/home-tsc"
