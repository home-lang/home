jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Image compression dependency
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev
      - name: Image API on Home development Zig
        if: matrix.zig == 'master'
        run: zig test packages/image/src/image.zig -lc -lz -O ReleaseSafe
      - run: |
          zig test packages/image/src/formats/raster_encoder.zig -lc -lz
          zig test packages/image/src/formats/raster_encoder.zig -lc -lz -O ReleaseSafe
          zig test packages/video/src/core/color_description.zig
          zig test packages/video/src/core/color_description.zig -O ReleaseSafe
          zig test packages/video/src/core/yuv_remap.zig
          zig test packages/video/src/core/yuv_remap.zig -O ReleaseSafe
          zig test packages/video/src/core/pixel_convert.zig
          zig test packages/video/src/core/pixel_convert.zig -O ReleaseSafe
          zig test packages/video/src/core/owned_fifo.zig
          zig test packages/video/src/core/catalog_state.zig
          zig test packages/video/src/core/device_identity.zig
          zig test packages/video/src/core/typed_catalog.zig
          zig test packages/image/src/ops/viewport.zig
          zig test packages/image/src/ops/viewport.zig -O ReleaseSafe
          zig test packages/image/src/ops/region.zig
          zig test packages/image/src/ops/region.zig -O ReleaseSafe
          zig test packages/image/src/ops/rgba_view.zig
          zig test packages/image/src/ops/rgba_view.zig -O ReleaseSafe
          zig test packages/image/src/ops/orientation.zig
          zig test packages/video/src/core/lease_pool.zig
          zig test packages/video/src/core/owned_admission.zig
          zig test packages/video/src/core/delivery_fifo.zig
          zig test packages/video/src/core/capacity_wait.zig
          zig test packages/video/src/core/output_recovery.zig
          zig test packages/video/src/core/factory_policy.zig
          zig test packages/video/src/core/frame_access.zig
          zig test packages/video/src/core/frame_barrier.zig
          zig test packages/video/src/core/pts_clock.zig
          zig test packages/video/src/core/pcm_fanout.zig
          zig test packages/video/src/core/pcm_fanout.zig -O ReleaseSafe
          zig test packages/video/src/core/frame_fanout.zig
          zig test packages/video/src/core/frame_fanout.zig -O ReleaseSafe
          zig test packages/video/src/core/packet_output.zig
          zig test packages/video/src/core/packet_ring.zig
          zig test packages/video/src/core/plane_pack.zig
