name: Packet and PTS output helpers
on:
  push:
    branches: [main]
    paths: ['packages/video/src/core/pts_clock.zig', 'packages/video/src/core/packet_output.zig', 'packages/video/src/core/owned_fifo.zig', 'packages/video/src/core/owned_admission.zig', 'packages/video/src/core/delivery_fifo.zig', 'packages/video/src/core/capacity_wait.zig', 'packages/video/src/core/output_recovery.zig', 'packages/video/src/core/factory_policy.zig', 'packages/video/src/core/recording_policy.zig', 'packages/video/src/core/session_config.zig', 'packages/video/src/core/keyed_state.zig', 'packages/video/src/core/packet_ring.zig', 'packages/video/src/core/plane_pack.zig', 'packages/video/docs/packet-output.md', 'packages/video/docs/packet-ring.md', '.github/workflows/media-packet-output.yml']
  pull_request:
    paths: ['packages/video/src/core/pts_clock.zig', 'packages/video/src/core/packet_output.zig', 'packages/video/src/core/owned_fifo.zig', 'packages/video/src/core/owned_admission.zig', 'packages/video/src/core/delivery_fifo.zig', 'packages/video/src/core/capacity_wait.zig', 'packages/video/src/core/output_recovery.zig', 'packages/video/src/core/factory_policy.zig', 'packages/video/src/core/recording_policy.zig', 'packages/video/src/core/session_config.zig', 'packages/video/src/core/keyed_state.zig', 'packages/video/src/core/packet_ring.zig', 'packages/video/src/core/plane_pack.zig', 'packages/video/docs/packet-output.md', 'packages/video/docs/packet-ring.md', '.github/workflows/media-packet-output.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  helpers:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - run: |
          zig test packages/video/src/core/owned_fifo.zig
          zig test packages/video/src/core/owned_admission.zig
          zig test packages/video/src/core/delivery_fifo.zig
          zig test packages/video/src/core/capacity_wait.zig
          zig test packages/video/src/core/output_recovery.zig
          zig test packages/video/src/core/factory_policy.zig
          zig test packages/video/src/core/pts_clock.zig
          zig test packages/video/src/core/packet_output.zig
          zig test packages/video/src/core/packet_ring.zig
          zig test packages/video/src/core/plane_pack.zig
          zig test packages/video/src/core/session_config.zig
          zig test packages/video/src/core/keyed_state.zig
