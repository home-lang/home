name: Video RTP framing
on:
  push:
    branches: [main]
    paths: ['packages/video/src/core/nal_convert.zig', 'packages/video/src/streaming/rtp*.zig', 'packages/video/src/rtp_test.zig', 'packages/video/src/video.zig', 'packages/video/tests/rtp_packetizer.zig', '.github/workflows/video-rtp.yml']
  pull_request:
    paths: ['packages/video/src/core/nal_convert.zig', 'packages/video/src/streaming/rtp*.zig', 'packages/video/src/rtp_test.zig', 'packages/video/src/video.zig', 'packages/video/tests/rtp_packetizer.zig', '.github/workflows/video-rtp.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rtp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: NAL boundaries RTP fragments RTCP and public API
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig test -lc -O "$mode" packages/video/src/rtp_test.zig
            zig test -lc -O "$mode" packages/video/src/streaming/rtp.zig
            zig test -lc -O "$mode" --dep video -Mroot=packages/video/tests/rtp_packetizer.zig -Mvideo=packages/video/src/video.zig
          done
