name: Streaming A/V modules
on:
  push:
    branches: [main]
    paths: ['packages/video/src/containers/av_stream.zig', 'packages/video/src/core/pcm_timeline.zig', 'packages/video/src/core/recording_policy.zig', 'packages/video/src/core/recording_path.zig', 'packages/audio/src/io/native_capture*', '.github/workflows/streaming-av.yml']
  pull_request:
    paths: ['packages/video/src/containers/av_stream.zig', 'packages/video/src/core/pcm_timeline.zig', 'packages/video/src/core/recording_policy.zig', 'packages/video/src/core/recording_path.zig', 'packages/audio/src/io/native_capture*', '.github/workflows/streaming-av.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  modules:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: |
          zig test packages/video/src/core/pcm_timeline.zig
          zig test packages/video/src/core/recording_policy.zig
          zig test packages/video/src/core/recording_path.zig
          zig test packages/video/src/containers/av_stream.zig
          cc -std=c11 -Wall -Wextra -Werror packages/audio/src/io/native_capture.c packages/audio/src/io/native_capture_test.c -lasound -o /tmp/home-capture-test
          /tmp/home-capture-test
          zig test packages/audio/src/io/native_capture.zig packages/audio/src/io/native_capture.c -lc -lasound
