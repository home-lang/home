name: POSIX environment ownership
on:
  push:
    branches: [main]
    paths: ['packages/env/src/env.zig', 'packages/env/src/posix_env.zig', 'packages/env/tests/*.zig', '.github/workflows/env-posix.yml']
  pull_request:
    paths: ['packages/env/src/env.zig', 'packages/env/src/posix_env.zig', 'packages/env/tests/*.zig', '.github/workflows/env-posix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Owned values, restoration and allocation failures
        run: |
          zig test -lc -O Debug packages/env/src/posix_env.zig
          zig test -lc -O ReleaseSafe packages/env/src/posix_env.zig
      - name: Public Linux/libc and long-value regression on current Home toolchain
        if: matrix.zig == 'master'
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig build-exe -lc -O "$mode" --dep env -Mroot=packages/env/tests/posix_exports.zig -Menv=packages/env/src/env.zig -femit-bin="$RUNNER_TEMP/home-env-exports"
            "$RUNNER_TEMP/home-env-exports"
          done
      - name: Explicit unsupported result without libc
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          zig build-exe --dep posix_env -Mroot=packages/env/tests/no_libc.zig -Mposix_env=packages/env/src/posix_env.zig -femit-bin="$RUNNER_TEMP/home-env-no-libc"
          "$RUNNER_TEMP/home-env-no-libc"
