name: Native AVC HEVC and MP4
on:
  push:
    paths:
      - 'packages/video/src/codecs/video/native_encoder.*'
      - 'packages/video/src/codecs/video/bit_reader.zig'
      - 'packages/video/src/codecs/video/hevc_conformance*.zig'
      - 'packages/video/src/util/bitstream.zig'
      - 'packages/video/src/bitstream_reader_tests.zig'
      - 'packages/video/src/codecs/video/rgb_i420.zig'
      - 'packages/video/src/containers/mp4_stream.zig'
      - 'packages/video/src/native_media_tests.zig'
      - 'packages/video/src/core/color_description.zig'
      - 'packages/video/tests/color_signal.zig'
      - 'packages/video/tests/native_encoder_idr.zig'
      - 'packages/video/docs/native-video.md'
      - 'packages/video/docs/color-description.md'
      - 'packages/video/test-native-media.sh'
      - '.github/workflows/native-media.yml'
  pull_request:
    paths:
      - 'packages/video/src/codecs/video/native_encoder.*'
      - 'packages/video/src/codecs/video/bit_reader.zig'
      - 'packages/video/src/codecs/video/hevc_conformance*.zig'
      - 'packages/video/src/util/bitstream.zig'
      - 'packages/video/src/bitstream_reader_tests.zig'
      - 'packages/video/src/codecs/video/rgb_i420.zig'
      - 'packages/video/src/containers/mp4_stream.zig'
      - 'packages/video/src/native_media_tests.zig'
      - 'packages/video/src/core/color_description.zig'
      - 'packages/video/tests/color_signal.zig'
      - 'packages/video/tests/native_encoder_idr.zig'
      - 'packages/video/docs/native-video.md'
      - 'packages/video/docs/color-description.md'
      - 'packages/video/test-native-media.sh'
      - '.github/workflows/native-media.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-media:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
        zig: ['0.15.2', 'master']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - run: sudo apt-get update && sudo apt-get install -y libx264-dev libx265-dev pkg-config
      - run: packages/video/test-native-media.sh
