name: Video sensor control helpers
on:
  push:
    branches: [main]
    paths: ['packages/video/src/core/manager_gate.zig', 'packages/video/src/core/sensor_node.zig', 'packages/video/src/core/boolean_control.zig', 'packages/video/src/video.zig', 'packages/video/tests/sensor_helpers.zig', '.github/workflows/video-sensor-controls.yml']
  pull_request:
    paths: ['packages/video/src/core/manager_gate.zig', 'packages/video/src/core/sensor_node.zig', 'packages/video/src/core/boolean_control.zig', 'packages/video/src/video.zig', 'packages/video/tests/sensor_helpers.zig', '.github/workflows/video-sensor-controls.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sensor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Exclusive managers exact sensor identity and observed control outcomes
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig test -lc -O "$mode" packages/video/src/core/manager_gate.zig
            zig test -lc -O "$mode" packages/video/src/core/sensor_node.zig
            zig test -lc -O "$mode" packages/video/src/core/boolean_control.zig
            zig test -lc -O "$mode" --dep video -Mroot=packages/video/tests/sensor_helpers.zig -Mvideo=packages/video/src/video.zig
          done
