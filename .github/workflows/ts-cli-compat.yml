name: TypeScript CLI compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  declaration-output:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.17.0-dev.2163+89ff10d56'
      - name: Test local project inventory coverage
        run: python3 scripts/tests/test-ts-project-inventory.py
      - name: Build the production TypeScript CLI
        env:
          HOME_RUN_MAX_MB: '3840'
        run: perl scripts/run-bounded.pl 1800 zig build home-tsc -Doptimize=ReleaseFast -Dhome-tsc-strip=true -Denable_jsc=false -j1 --summary all
      - name: Test compiler modules
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 600 zig build test -Dfilter=ts_cli -Denable_jsc=false -j1 --summary all
          perl scripts/run-bounded.pl 600 zig build test -Dfilter=tsc_main -Denable_jsc=false -j1 --summary all
          perl scripts/run-bounded.pl 600 zig build test -Dfilter=tsconfig -Denable_jsc=false -j1 --summary all
          perl scripts/run-bounded.pl 600 zig build test -Dfilter=tsc_streams -Denable_jsc=false -j1 --summary all
          perl scripts/run-bounded.pl 600 zig build test -Dfilter=ts_program -Denable_jsc=false -j1 --summary all
          perl scripts/run-bounded.pl 600 zig build test -Dfilter=ts_parser -Denable_jsc=false -j1 --summary all
          perl scripts/run-bounded.pl 900 zig build test -Dfilter=ts_checker -Denable_jsc=false -j1 --summary all
      - name: Install the isolated reference compiler
        run: npm install --prefix "$RUNNER_TEMP/home-ts-reference" --no-save --ignore-scripts typescript@7.0.2
      - name: Compare declaration, build, clean and watch contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-declaration-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-declaration-contracts"
      - name: Compare recursive ambient interface contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-recursive-interface-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-recursive-interface-contracts"
      - name: Compare automatic variable flow and scope contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 600 python3 scripts/tests/test-ts-automatic-variable-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-automatic-variable-contracts"
      - name: Compare optional indexed read and write contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-optional-indexed-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-optional-indexed-contracts"
      - name: Compare generic indexed return and inference contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-generic-indexed-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-generic-indexed-contracts"
      - name: Compare imported generic inheritance and inference contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-imported-generic-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-imported-generic-contracts"
      - name: Compare optional object write contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-optional-object-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-optional-object-contracts"
      - name: Compare library array and dictionary contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-library-array-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-library-array-contracts"
      - name: Compare declaration index and grammar contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-declaration-index-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-declaration-index-contracts"
      - name: Compare installed compiler library discovery
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 300 python3 scripts/tests/test-ts-installed-library-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-installed-library-contracts"
      - name: Compare scoped ambient declaration contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 600 python3 scripts/tests/test-ts-ambient-owner-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-ambient-owner-contracts"
      - name: Compare global interface ownership and overload contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 600 python3 scripts/tests/test-ts-global-owner-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-global-owner-contracts"
      - name: Compare syntax-only file discovery contracts
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 600 python3 scripts/tests/test-ts-list-files-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-list-files-contracts"
      - name: Compare option aliases and boolean overrides
        env:
          HOME_RUN_MAX_MB: '3840'
        run: |
          perl scripts/run-bounded.pl 600 python3 scripts/tests/test-ts-option-identity-cli.py \
            --home zig-out/bin/home-tsc \
            --reference "$RUNNER_TEMP/home-ts-reference/node_modules/typescript/bin/tsc" \
            --output "$RUNNER_TEMP/home-ts-option-identity-contracts"
      - name: Retain reference and Home observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-cli-contracts-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/home-ts-declaration-contracts
            ${{ runner.temp }}/home-ts-recursive-interface-contracts
            ${{ runner.temp }}/home-ts-automatic-variable-contracts
            ${{ runner.temp }}/home-ts-optional-indexed-contracts
            ${{ runner.temp }}/home-ts-generic-indexed-contracts
            ${{ runner.temp }}/home-ts-imported-generic-contracts
            ${{ runner.temp }}/home-ts-optional-object-contracts
            ${{ runner.temp }}/home-ts-library-array-contracts
            ${{ runner.temp }}/home-ts-declaration-index-contracts
            ${{ runner.temp }}/home-ts-installed-library-contracts
            ${{ runner.temp }}/home-ts-ambient-owner-contracts
            ${{ runner.temp }}/home-ts-global-owner-contracts
            ${{ runner.temp }}/home-ts-list-files-contracts
            ${{ runner.temp }}/home-ts-option-identity-contracts
          if-no-files-found: ignore
          retention-days: 14
