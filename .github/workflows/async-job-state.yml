name: Async job terminal states
on:
  push:
    paths:
      - 'packages/async/src/task.zig'
      - 'packages/async/src/job_state.zig'
      - 'packages/async/src/completion_gate.zig'
      - 'packages/async/src/completion_watermark.zig'
      - '.github/workflows/async-job-state.yml'
  pull_request:
    paths:
      - 'packages/async/src/task.zig'
      - 'packages/async/src/job_state.zig'
      - 'packages/async/src/completion_gate.zig'
      - 'packages/async/src/completion_watermark.zig'
      - '.github/workflows/async-job-state.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  state:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.15.2
      - run: |
          for mode in Debug ReleaseSafe; do
            zig test packages/async/src/task.zig -lc -O "$mode"
            zig test packages/async/src/completion_gate.zig -O "$mode"
            zig test packages/async/src/completion_watermark.zig -O "$mode"
          done
