name: Deploy Docs

# Push-to-deploy for home-lang.org.
#
# Only paths that can change the rendered site trigger it — the compiler and
# runtime work in this repo lands constantly and must not redeploy a docs site
# it cannot affect. Anything reachable from the BunPress build belongs here.
on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.config/**'
      - 'bunpress.config.ts'
      - 'cloud.config.ts'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# One deploy at a time, and never cancel one midway: the release is only atomic
# once `current` is flipped, and a cancelled run can leave the box on a
# half-swapped release.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://home-lang.org
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6
        # The docs build reads only `docs/`; the vendored submodules under
        # `_submodules/` are large and are excluded from the secret scan anyway.
        with:
          submodules: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # No `bun install` step. Both tools are fetched on demand by `bunx`, and
      # the only imports the two config files make are type-only or a relative
      # file, so nothing here needs node_modules. The repo's package.json also
      # lists Pantry packages (`zig-dtsx`, `ziglang.org`) that do not resolve on
      # npm, so an install step would fail this job on dependencies the docs
      # never touch.

      - name: Prepare deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "DEPLOY_SSH_KEY is not set — the deploy cannot reach the box." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub

      - name: Build and deploy
        # Everything is in cloud.config.ts: ts-cloud runs the BunPress build,
        # packages `dist/docs/.bunpress`, ships it, reconciles DNS and reloads
        # the gateway. Pinned so a deploy is reproducible.
        run: bunx --bun @stacksjs/ts-cloud@0.7.121 deploy --env production --yes
        env:
          # This project attaches to the shared stacks box, so the deploy needs
          # the Hetzner token to find it and the Porkbun credentials to
          # reconcile home-lang.org's records.
          HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
          PORKBUN_API_KEY: ${{ secrets.PORKBUN_API_KEY }}
          PORKBUN_SECRET_KEY: ${{ secrets.PORKBUN_SECRET_KEY }}

      - name: Verify the deployed site
        # The runner cannot always resolve the public name, so ask the box
        # itself over its own loopback. `/docs` is checked as well as `/`,
        # because the landing page and the documentation are now one release
        # and a wrong site root would serve one without the other.
        run: |
          check() {
            code=$(ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o ConnectTimeout=30 \
              root@178.105.248.188 \
              "curl -s -o /dev/null -w '%{http_code}' --resolve $1:443:127.0.0.1 https://$1$2")
            echo "$1$2 -> $code (expected $3)"
            [ "$code" = "$3" ] || { echo "::error::$1$2 returned $code, expected $3"; exit 1; }
          }

          check home-lang.org / 200
          check home-lang.org /docs 200
          check home-lang.org /docs/guide/getting-started 200
          # The old docs host is a redirect now, not a second copy of the site.
          check docs.home-lang.org / 301
