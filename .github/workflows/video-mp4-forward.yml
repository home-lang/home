name: Video forward MP4
on:
  push:
    branches: [main]
    paths: ['packages/video/src/containers/mp4_stream.zig', 'packages/video/src/video.zig', 'packages/video/tests/mp4_forward.zig', '.github/workflows/video-mp4-forward.yml']
  pull_request:
    paths: ['packages/video/src/containers/mp4_stream.zig', 'packages/video/src/video.zig', 'packages/video/tests/mp4_forward.zig', '.github/workflows/video-mp4-forward.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mux:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        zig: ['0.15.2', master]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: ${{ matrix.zig }}
      - name: Bounded forward-only MP4 and public API
        shell: bash
        run: |
          set -euo pipefail
          for mode in Debug ReleaseSafe; do
            zig test -O "$mode" packages/video/src/containers/mp4_stream.zig
            zig test -O "$mode" --dep video -Mroot=packages/video/tests/mp4_forward.zig -Mvideo=packages/video/src/video.zig
          done
